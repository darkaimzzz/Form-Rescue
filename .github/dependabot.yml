version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        dependency-type: development
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint supports TypeScript <6.1; revisit when it supports 7.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the pinned Node LTS (.nvmrc = 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
