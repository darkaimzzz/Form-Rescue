name: Website

# Builds the static site on every PR (preview: noindex, no canonicals).
# Production deployment runs only when a maintainer dispatches it and the
# repository variables PUBLIC_SITE_ORIGIN and PUBLIC_REPO_URL are set.
on:
  pull_request:
    paths: ["apps/website/**", "packages/design-tokens/**", "CHANGELOG.md"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (production)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          PUBLIC_SITE_ORIGIN: ${{ inputs.deploy && vars.PUBLIC_SITE_ORIGIN || '' }}
          PUBLIC_REPO_URL: ${{ vars.PUBLIC_REPO_URL }}
          PUBLIC_CHROME_STORE_URL: ${{ vars.PUBLIC_CHROME_STORE_URL }}
          PUBLIC_EDGE_STORE_URL: ${{ vars.PUBLIC_EDGE_STORE_URL }}
          PUBLIC_FIREFOX_STORE_URL: ${{ vars.PUBLIC_FIREFOX_STORE_URL }}
        run: pnpm --filter @form-rescue/website build
      - if: inputs.deploy
        run: test -n "${{ vars.PUBLIC_SITE_ORIGIN }}" || (echo "PUBLIC_SITE_ORIGIN is not configured" && exit 1)
      - if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
