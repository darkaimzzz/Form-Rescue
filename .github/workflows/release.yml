name: Release (draft)

# Manual, maintainer-triggered. Produces a DRAFT GitHub release with unsigned
# packages built from the tag. Store submission is a separate, human step
# (docs/release.md). No store credentials are used here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm test:integration
      - run: pnpm test:e2e:chrome
      - run: pnpm release:reproducible
      - run: pnpm package
      - run: pnpm release:validate
      - name: Build environment
        run: |
          { echo "node $(node -v)"; echo "pnpm $(pnpm -v)"; uname -a; } > release/BUILD-ENVIRONMENT.txt
          cp test-results/reproducible.json release/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          body_path: CHANGELOG.md
          files: release/*
