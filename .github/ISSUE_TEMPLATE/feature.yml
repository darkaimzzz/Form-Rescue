name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you're trying to solve
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy implications
      description: What data would this read, store or expose? Does it need new permissions?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
